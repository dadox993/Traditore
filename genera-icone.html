<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genera Icone Il Traditore</title>
  <style>
    body {
      background: #09090d;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    canvas {
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      max-width: 220px;
      height: auto;
    }
    .btn {
      background: linear-gradient(135deg, #e5c158, #b88d1e);
      color: #09090d;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <h2>Icone App — Il Traditore</h2>
  <canvas id="preview" width="512" height="512"></canvas>
  <button class="btn" onclick="downloadIcon(192)">1. Scarica icon-192.png</button>
  <button class="btn" onclick="downloadIcon(512)">2. Scarica icon-512.png</button>

  <script>
    function drawCrownIcon(canvas) {
      const size = canvas.width;
      const ctx = canvas.getContext('2d');
      const cx = size / 2;
      const cy = size / 2;

      // Sfondo scuro radial gradient
      const bg = ctx.createRadialGradient(cx, cy * 0.85, size * 0.05, cx, cy, size * 0.72);
      bg.addColorStop(0, '#1e1c2b');
      bg.addColorStop(1, '#09090d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);

      // Anello dorato esterno
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.41, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.55)';
      ctx.lineWidth = size * 0.014;
      ctx.stroke();

      // Gradiente oro per la corona
      const gold = ctx.createLinearGradient(0, size * 0.28, 0, size * 0.72);
      gold.addColorStop(0, '#f3d473');
      gold.addColorStop(0.5, '#d4af37');
      gold.addColorStop(1, '#9e7816');
      ctx.fillStyle = gold;

      // Sagoma corona
      const w = size * 0.46;
      const h = size * 0.30;
      const left = cx - w / 2;
      const right = cx + w / 2;
      const top = cy - h * 0.48;
      const bottom = cy + h * 0.48;

      ctx.beginPath();
      ctx.moveTo(left, bottom);
      ctx.lineTo(left - w * 0.06, top + h * 0.18);
      ctx.lineTo(cx - w * 0.22, top + h * 0.52);
      ctx.lineTo(cx, top);
      ctx.lineTo(cx + w * 0.22, top + h * 0.52);
      ctx.lineTo(right + w * 0.06, top + h * 0.18);
      ctx.lineTo(right, bottom);
      ctx.closePath();
      ctx.fill();

      // Base corona
      const baseTop = bottom + size * 0.025;
      const baseH = size * 0.045;
      ctx.beginPath();
      ctx.roundRect(left, baseTop, w, baseH, size * 0.015);
      ctx.fill();

      // Gemme sulle punte
      const gems = [
        [left - w * 0.06, top + h * 0.13],
        [cx, top - size * 0.02],
        [right + w * 0.06, top + h * 0.13]
      ];
      gems.forEach(([gx, gy]) => {
        ctx.beginPath();
        ctx.arc(gx, gy, size * 0.022, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    drawCrownIcon(document.getElementById('preview'));

    function downloadIcon(px) {
      const c = document.createElement('canvas');
      c.width = px;
      c.height = px;
      drawCrownIcon(c);
      const link = document.createElement('a');
      link.download = `icon-${px}.png`;
      link.href = c.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
